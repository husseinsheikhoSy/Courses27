<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title id="page-title">Unlock This Course | Korshub Deals</title>
<meta name="description" id="meta-description" content="Unlock this course link for free. Watch two short ads for instant, mobile-friendly access." />
<meta name="theme-color" content="#1414c4" />
<meta property="og:title" id="og-title" content="Unlock This Course" />
<meta property="og:description" id="og-description" content="Watch two short ads to unlock this course link." />
<meta property="og:image" id="og-image" content="" />

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- Open outbound links via Telegram's in-app browser -->
<script>
(function() {
  var _origOpen = window.open;
  window.open = function(url, target, features) {
    if (url && typeof url === 'string' && url.indexOf('http') === 0) {
      var tgApp = window.Telegram && window.Telegram.WebApp;
      if (tgApp && typeof tgApp.openLink === 'function') {
        try { tgApp.openLink(url, { try_instant_view: false }); return null; } catch(e) {}
      }
      return _origOpen.call(window, url, '_blank', features);
    }
    return _origOpen.apply(window, arguments);
  };
})();
</script>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
:root{
  --blue:#1414c4; --blue-bright:#2f2fe0; --blue-dark:#0a0a70;
  --blue-soft:rgba(20,20,196,.10); --blue-glow:rgba(20,20,196,.35);
  --bg:#0b0b12; --surface:#101018; --surface-2:#151522; --surface-3:#1c1c30;
  --text:#f2f2f8; --text-muted:#9797b3; --border:#22223a;
  --success:#1fa15a; --gold:#e0a326;
  --radius-xl:28px; --radius-lg:20px; --radius-md:15px;
  --shadow:0 24px 60px rgba(20,20,196,.30);
  --tg-viewport-height:100vh;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);height:100%;}
body{
  font-family:'Inter',sans-serif;color:var(--text);min-height:100%;height:100%;
  background:
    radial-gradient(circle at 50% -15%, rgba(20,20,196,.22), transparent 45%),
    linear-gradient(180deg,#000000 0%,#0b0b12 60%,#000000 100%);
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.app-shell{width:100%;max-width:470px;min-height:100%;height:100%;background:var(--surface);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
@media (min-width:481px){
  body{padding:24px 14px 40px;min-height:100vh;height:auto;}
  .app-shell{border-radius:var(--radius-xl);min-height:auto;height:auto;box-shadow:var(--shadow);
    max-height:calc(var(--tg-viewport-height,100vh) - 48px);border:1px solid var(--border);}
}

.top-bar{
  padding:18px 16px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--blue) 0%,#000000 100%);color:#fff;
}
.back-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;cursor:pointer;color:#fff;}
.top-bar h2{font-size:14px;font-weight:800;}

.skeleton{padding:16px;display:none;}
.skeleton.visible{display:block;}
.skel-block{background:var(--surface-2);border-radius:var(--radius-md);height:60px;margin-bottom:12px;animation:shimmer 1.4s infinite ease-in-out;}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}

#main-card{display:none;padding:18px 16px 26px;}
#main-card.visible{display:block;}

.course-header{display:flex;gap:12px;margin-bottom:14px;}
.course-thumb{width:82px;height:82px;border-radius:14px;flex-shrink:0;overflow:hidden;background:#000;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:30px;}
.course-thumb img{width:100%;height:100%;object-fit:cover;}
.course-title{font-size:16px;font-weight:800;line-height:1.35;color:var(--text);}
#course-cat{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:800;color:#cfcfff;
  background:#000;border:1px solid var(--border);padding:3px 9px;border-radius:7px;}

.price-box{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:16px;
}
.price-left{display:flex;flex-direction:column;gap:2px;}
.price-old{font-size:12px;color:var(--text-muted);text-decoration:line-through;font-weight:700;}
.price-now{font-size:18px;font-weight:900;color:#5c5cff;}
.price-now.free-text{color:var(--success);}
.discount-badge{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-size:12px;
  font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap;}

.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.step{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-md);
  background:var(--surface); border:1px solid var(--border);
}
.step.locked{opacity:.5;}
.step.done{border-color:var(--success);background:rgba(31,161,90,.08);}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:#8f8fff;
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border);}
.step.done .step-num{background:var(--success);color:#fff;border:none;}
.step-body{flex:1;min-width:0;}
.step-body b{font-size:13px;font-weight:800;display:block;color:var(--text);}
.step-body span{font-size:11px;color:var(--text-muted);font-weight:600;}
.step-btn{
  border:none;border-radius:11px;padding:9px 14px;font-size:12px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));cursor:pointer;white-space:nowrap;
}
.step-btn:disabled{opacity:.5;cursor:default;}
.step-btn.watching{opacity:.75;}

.progress-track{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--blue-bright));transition:width .35s;}
#progress-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:6px;text-align:center;}

.cta-btn{
  width:100%;padding:16px;border:none;border-radius:16px;font-size:15px;font-weight:900;
  background:var(--surface-3);color:var(--text-muted);cursor:not-allowed;
}
.cta-btn.unlocked{
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;cursor:pointer;
  box-shadow:0 14px 32px rgba(20,20,196,.45);
}
#success-msg{display:none;text-align:center;font-size:12px;font-weight:700;color:var(--success);margin-top:10px;}
#success-msg.visible{display:block;}
#ad-notice{text-align:center;font-size:11px;color:var(--text-muted);font-weight:600;margin-top:10px;}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;display:none;z-index:999;}

/* ── Course details ("Korshub's take") section ── */
#details-section{margin-top:18px;border-top:1px solid var(--border);padding-top:16px;display:none;}
#details-section.visible{display:block;}
#details-section h3{font-size:13px;font-weight:800;color:#8f8fff;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.04em;}
.details-body{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;font-size:12.5px;line-height:1.7;color:var(--text-muted);white-space:pre-line;}
.details-body b, .details-body strong{color:var(--text);}
</style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <h2>Unlock Course Link</h2>
  </div>

  <div class="skeleton visible" id="skeleton">
    <div class="skel-block"></div>
    <div class="skel-block"></div>
    <div class="skel-block"></div>
  </div>

  <div id="main-card">
    <div class="course-header">
      <div class="course-thumb" id="course-thumb">🎓</div>
      <div>
        <div class="course-title" id="course-title">Loading…</div>
        <span id="course-cat"></span>
      </div>
    </div>

    <div class="price-box" id="price-box">
      <div class="price-left">
        <span class="price-old" id="price-old"></span>
        <span class="price-now" id="price-now"></span>
      </div>
      <span class="discount-badge" id="discount-badge" style="display:none;"></span>
    </div>

    <div class="steps">
      <div class="step" id="step-1">
        <div class="step-num" id="num-1">1</div>
        <div class="step-body">
          <b>Watch a short ad</b>
          <span id="sub-1">Tap to start</span>
        </div>
        <button class="step-btn" id="btn-1" onclick="watchAd(1)">▶ Watch</button>
      </div>
      <div class="step locked" id="step-2">
        <div class="step-num" id="num-2">2</div>
        <div class="step-body">
          <b>Watch a second ad</b>
          <span id="sub-2">Unlocks after step 1</span>
        </div>
        <button class="step-btn" id="btn-2" disabled onclick="watchAd(2)">▶ Watch</button>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="progress-label">Watch both ads to unlock your link</div>

    <button class="cta-btn" id="btn-enroll" disabled>🔒 Locked</button>
    <div id="success-msg">✅ Unlocked! Tap above to open your course.</div>
    <div id="ad-notice">⚠️ Watch both ads, then your link unlocks automatically.</div>
<br>
    <div id="details-section">
      <h3>Course Details</h3>
      <div class="details-body" id="details-body"></div>
    </div>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
const tg = window.Telegram?.WebApp || null;
if (tg) { tg.ready(); tg.expand(); }

// Same Supabase project the bot writes courses to — kept exactly as configured.
const SUPABASE_URL = 'https://uliqzxsjnzmimebgppap.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QhO2ft170kcZ1pP8YWl4ZQ_wjhKs5KK';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Adsgram block IDs — kept exactly as in the existing ad-flow templates.
const ADSGRAM_INTERSTITIAL_ID_1 = 'int-47443';
const ADSGRAM_INTERSTITIAL_ID_2 = 'int-47444';
const AD_TIMEOUT_MS = 12000;

let step1Done = false, step2Done = false, adPlaying = false;
let ctrl1 = null, ctrl2 = null;
let GO_URL = 'https://korshub.com/';

function getAdsgramInterstitial(stepNum) {
  const blockId = stepNum === 1 ? ADSGRAM_INTERSTITIAL_ID_1 : ADSGRAM_INTERSTITIAL_ID_2;
  if (stepNum === 1 && ctrl1) return ctrl1;
  if (stepNum === 2 && ctrl2) return ctrl2;
  if (window.Adsgram && typeof window.Adsgram.init === 'function') {
    const controller = window.Adsgram.init({ blockId });
    if (stepNum === 1) ctrl1 = controller; else ctrl2 = controller;
    return controller;
  }
  return null;
}

function showAdsgramInterstitial(stepNum) {
  return new Promise((resolve) => {
    const ctrl = getAdsgramInterstitial(stepNum);
    if (!ctrl) { resolve('no_ad'); return; }
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { settled = true; resolve('no_ad'); } }, AD_TIMEOUT_MS);
    ctrl.show()
      .then(() => { if (!settled) { settled = true; clearTimeout(timer); resolve('shown'); } })
      .catch(() => { if (!settled) { settled = true; clearTimeout(timer); resolve('no_ad'); } });
  });
}

function watchAd(stepNum) {
  if (adPlaying) return;
  if (stepNum === 1 && step1Done) return;
  if (stepNum === 2 && (!step1Done || step2Done)) return;
  adPlaying = true;

  const btn = document.getElementById('btn-' + stepNum);
  btn.classList.add('watching');
  btn.textContent = '⏳ Loading ad…';

  showAdsgramInterstitial(stepNum).then((status) => {
    adPlaying = false;
    btn.classList.remove('watching');
    completeStep(stepNum, status !== 'shown');
  });
}

function completeStep(stepNum, skipped) {
  const step = document.getElementById('step-' + stepNum);
  const btn  = document.getElementById('btn-' + stepNum);
  const sub  = document.getElementById('sub-' + stepNum);
  const num  = document.getElementById('num-' + stepNum);

  step.classList.add('done');
  num.textContent = '✓';
  btn.disabled = true;
  btn.textContent = '✓ Completed';
  sub.textContent = skipped ? 'Ad unavailable — continued ✓' : 'Done ✓';

  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');

  if (stepNum === 1) {
    step1Done = true;
    fill.style.width = '50%';
    label.textContent = 'Step 1 done — continue to step 2';
    document.getElementById('step-2').classList.remove('locked');
    document.getElementById('btn-2').disabled = false;
    document.getElementById('sub-2').textContent = 'Tap to open the second ad';
  } else {
    step2Done = true;
    fill.style.width = '100%';
    label.textContent = 'All steps completed!';
    unlockEnroll();
    launchConfetti();
  }
}

function unlockEnroll() {
  const btn = document.getElementById('btn-enroll');
  btn.disabled = false;
  btn.className = 'cta-btn unlocked';
  btn.innerHTML = '🚀 Get This Course';
  document.getElementById('success-msg').classList.add('visible');
  document.getElementById('ad-notice').style.display = 'none';
}

function enrollNow() {
  if (!step2Done) return;
  if (tg && typeof tg.openLink === 'function') {
    tg.openLink(GO_URL, { try_instant_view: false });
  } else {
    window.open(GO_URL, '_blank');
  }
}
document.getElementById('btn-enroll').addEventListener('click', enrollNow);

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#1414c4', '#2f2fe0', '#ffffff', '#0a0a70', '#5c5cff'];
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 5 + 3, d: Math.random() * 2 + 1,
    color: colors[Math.floor(Math.random()*colors.length)],
    tilt: Math.random()*10-5, tiltSpeed: (Math.random()*.07+.03) * (Math.random()<.5?1:-1),
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.beginPath(); ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r*0.4, p.tilt, 0, Math.PI*2); ctx.fill();
      p.y += p.d + frame/80; p.tilt += p.tiltSpeed; p.x += Math.sin(frame/20) * 0.5;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

// ── Load course by id (slug) from Supabase and populate the page ──
function getCourseId() {
  return new URLSearchParams(window.location.search).get('id') ||
    tg?.initDataUnsafe?.start_param || null;
}

// Escape HTML, but keep line breaks — the bot's `details` column is plain
// text with "\n" between paragraphs / bullets (see render_details_plain
// in the bot script), so we escape first, then turn "\n" into <br>.
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function detailsToHTML(str) {
  return escapeHtml(str).trim().replace(/\n/g, '<br>');
}

async function loadCourse() {
  const id = getCourseId();
  if (!id) { showCard(); return; }

  const { data, error } = await sb.from('courses').select('*').eq('id', id).single();
  if (error || !data) { showCard(); return; }

  GO_URL = data.go_url || data.course_url || GO_URL;

  document.getElementById('course-title').textContent = data.title || '';
  document.getElementById('page-title').textContent = (data.title || 'Course') + ' — Korshub Deals';
  document.getElementById('meta-description').setAttribute('content',
    `Unlock "${data.title || 'this course'}" for free. Watch two short ads for instant access.`);
  document.getElementById('og-title').setAttribute('content', data.title || 'Unlock This Course');
  if (data.category) document.getElementById('course-cat').textContent =
    data.category + (data.platform ? ' · ' + data.platform : '');

  if (data.image) {
    document.getElementById('course-thumb').innerHTML =
      `<img src="${data.image}" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🎓'"/>`;
    document.getElementById('og-image').setAttribute('content', data.image);
  }

  if (data.is_free) {
    document.getElementById('price-now').textContent = 'FREE';
    document.getElementById('price-now').classList.add('free-text');
  } else if (data.has_discount) {
    if (data.original_price) document.getElementById('price-old').textContent = data.original_price;
    document.getElementById('price-now').textContent = data.current_price || '';
    const badge = document.getElementById('discount-badge');
    badge.style.display = 'inline-block';
    badge.textContent = (data.discount_percent || 'DEAL') + ' OFF';
  } else if (data.current_price) {
    document.getElementById('price-now').textContent = data.current_price;
  } else {
    document.getElementById('price-box').style.display = 'none';
  }

  // Course details ("Korshub's take" box scraped by the bot into the
  // `details` column) — only shown when there's actually something there.
  if (data.details && String(data.details).trim()) {
    document.getElementById('details-body').innerHTML = detailsToHTML(data.details);
    document.getElementById('details-section').classList.add('visible');
  }

  showCard();
}

function showCard() {
  document.getElementById('skeleton').classList.remove('visible');
  document.getElementById('main-card').classList.add('visible');
}

window.addEventListener('load', loadCourse);
</script>
</body>
</html>
