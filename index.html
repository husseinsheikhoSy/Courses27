<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Courses2027 — Free Courses & Deals</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:#ed173f;--r2:#b5082d;--r3:#8e0626;--text:#18181b;--muted:#6b6870;--border:#f2d9df}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Mulish,sans-serif;background:linear-gradient(155deg,#fff4f6,#ffbdc9 50%,#ed173f);min-height:100vh;padding-bottom:32px;color:var(--text)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--r),var(--r3));padding:15px 16px;display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}.lt{font-weight:900;color:#fff;font-size:15px}.badge{margin-left:auto;background:#fff;color:var(--r2);font-size:10px;font-weight:900;padding:5px 9px;border-radius:18px}
.filters{display:flex;gap:8px;overflow:auto;padding:14px 15px 5px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex-shrink:0;background:#fff;border:1px solid var(--border);color:var(--r2);padding:7px 13px;border-radius:22px;font-size:11px;font-weight:900}.chip.active{background:linear-gradient(135deg,var(--r),var(--r3));color:#fff;border-color:transparent}
.grid{max-width:560px;margin:auto;padding:10px 15px;display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:18px;box-shadow:0 5px 24px #8e062622;padding:12px;display:flex;gap:12px;text-decoration:none;color:inherit}.thumb{width:82px;height:82px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--r),var(--r3));display:flex;align-items:center;justify-content:center;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover}.body{min-width:0;flex:1}.title{font-size:13px;font-weight:900;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tag{font-size:9px;font-weight:900;padding:3px 7px;border-radius:5px;background:#ffe4e9;color:var(--r2)}.free{background:linear-gradient(135deg,var(--r),var(--r3));color:#fff}.deal{background:#111;color:#fff}.price{margin-top:6px;font-size:12px;font-weight:900}.old{color:#999;text-decoration:line-through;margin-left:4px}.meta{margin-top:5px;color:var(--muted);font-size:10px;font-weight:800}.state{text-align:center;color:#fff;font-weight:900;padding:60px 20px;font-size:13px}
</style></head><body>
<div class="top"><div class="logo">🎓</div><div class="lt">Courses2027 — Free Courses & Deals</div><div class="badge">KORSHUB</div></div>
<div class="filters" id="filters"><div class="chip active" data-cat="all">All</div><div class="chip" data-cat="Development">Development</div><div class="chip" data-cat="IT & Software">IT & Software</div><div class="chip" data-cat="Data Science">Data Science</div><div class="chip" data-cat="Design">Design</div></div>
<div class="grid" id="grid"><div class="state">Loading latest courses… 🔥</div></div>
<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}
const U="https://uliqzxsjnzmimebgppap.supabase.co",K="sb_publishable_QhO2ft170kcZ1pP8YWl4ZQ_wjhKs5KK";let all=[],active="all";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money=v=>v==null||v===""?"":(Number.isInteger(Number(v))?"$"+v:"$"+Number(v).toFixed(2));
function card(c){let img=c.image?`<img src="${esc(c.image)}" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🎓'">`:"🎓";let st=c.is_free?'<span class="tag free">100% FREE</span>':`<span class="tag deal">${esc(c.discount||"DEAL")}</span>`;let p=!c.is_free&&c.price!=null?`<div class="price">${esc(money(c.price))}${c.original_price?` <span class="old">${esc(money(c.original_price))}</span>`:""}</div>`:"";let m=[c.platform,c.rating?"⭐ "+c.rating:"",c.level].filter(Boolean).join(" • ");return `<a class="card" href="info.html?id=${encodeURIComponent(c.id)}"><div class="thumb">${img}</div><div class="body"><div class="title">${esc(c.title)}</div><div class="tags">${st}<span class="tag">${esc(c.category||"Course")}</span></div>${p}<div class="meta">${esc(m)}</div></div></a>`}
function render(){let a=active==="all"?all:all.filter(x=>x.category===active);grid.innerHTML=a.length?a.map(card).join(""):'<div class="state">No courses found. Check back soon! 🎓</div>'}
filters.onclick=e=>{let b=e.target.closest(".chip");if(!b)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");active=b.dataset.cat;render()};
const deep=tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("startapp")||new URLSearchParams(location.search).get("tgWebAppStartParam");if(deep)location.replace("info.html?id="+encodeURIComponent(deep));
async function load(){try{let r=await fetch(`${U}/rest/v1/courses?select=*&order=updated_at.desc,created_at.desc&limit=200`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});all=await r.json();if(!Array.isArray(all))all=[]}catch(e){all=[]}render()}if(!deep)load();
</script></body></html>
