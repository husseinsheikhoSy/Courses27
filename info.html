<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Courses2027 — Course Details</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand-pink:        #e8185a;
      --brand-pink-dark:   #b50d42;
      --brand-cherry:      #9b1239;
      --brand-gradient:    linear-gradient(135deg, #e8185a, #9b1239);
      --bg:                #fff5f8;
      --card:              #ffffff;
      --text:              #1c1d1f;
      --text-muted:        #6a6f73;
      --border:            #f0dde5;
      --chip-bg:           #fde6ee;
      --step-done-bg:      #e6f4ea;
      --step-done-text:    #1e7e34;
      --radius-card:       20px;
      --radius-btn:        10px;
      --shadow-card:       0 4px 24px rgba(155,18,57,.12);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Mulish', sans-serif;
      background: linear-gradient(160deg, #ffe0ec 0%, #ffb8cf 40%, #ff8fb5 70%, #ff6699 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display:flex; flex-direction:column; align-items:center;
      padding:0 0 32px; overflow-x:hidden; position:relative;
    }

    .cherry-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .cherry-pair { position:absolute; animation:cherryFloat linear infinite; opacity:.15; user-select:none; }
    @keyframes cherryFloat {
      0%{transform:translateY(110vh) rotate(0deg);opacity:0;}
      5%{opacity:.15;} 95%{opacity:.15;}
      100%{transform:translateY(-12vh) rotate(360deg);opacity:0;}
    }

    .top-bar { width:100%; background:var(--brand-gradient); padding:14px 20px 12px;
      display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
    .back-btn { color:#fff; font-size:20px; text-decoration:none; flex-shrink:0; }
    .logo-text { font-size:15px; font-weight:800; color:#fff; }
    .badge-free { margin-left:auto; background:#fff; color:var(--brand-pink-dark);
      font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; }

    .card {
      width:calc(100% - 28px); max-width:440px; margin:16px auto 0;
      background:var(--card); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
      padding:18px 16px 16px; animation:slideUp .4s cubic-bezier(.22,.61,.36,1) both;
      position:relative; z-index:1;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

    .course-info { display:flex; gap:10px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); }
    .course-thumb { width:64px; height:64px; border-radius:12px; background:var(--brand-gradient);
      flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; }
    .course-thumb img { width:100%; height:100%; object-fit:cover; }
    .course-meta { flex:1; min-width:0; }
    .course-title { font-size:14px; font-weight:800; margin-bottom:5px; line-height:1.35; }
    .course-tags { display:flex; gap:5px; flex-wrap:wrap; }
    .tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; background:var(--chip-bg); color:var(--brand-pink-dark); }
    .tag.free-tag { background:var(--brand-gradient); color:#fff; }
    .course-meta-row { font-size:11px; font-weight:700; color:var(--text-muted); line-height:1.6; margin-top:5px; }

    .description { font-size:12px; color:var(--text-muted); line-height:1.55; margin-bottom:14px; }

    .info-grid { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .info-row { display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--text); }
    .info-row .ic { flex-shrink:0; }

    .unlock-headline { text-align:center; margin-bottom:10px; }
    .unlock-headline h2 { font-size:15px; font-weight:900; color:var(--text); line-height:1.3; }
    .unlock-headline p  { font-size:11px; color:var(--text-muted); margin-top:3px; line-height:1.5; }

    .timer-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:14px; }
    .timer-ring-box { position:relative; width:76px; height:76px; }
    .timer-ring-box svg { transform:rotate(-90deg); width:76px; height:76px; }
    .timer-ring-box circle { fill:none; stroke-width:5; }
    .timer-ring-bg { stroke:var(--border); }
    .timer-ring-fg { stroke:var(--brand-pink-dark); stroke-linecap:round;
      stroke-dasharray:213; stroke-dashoffset:0; transition:stroke-dashoffset 1s linear; }
    .timer-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:20px; font-weight:900; color:var(--brand-pink-dark); }

    .skip-btn {
      background:var(--brand-gradient); color:#fff; border:none; border-radius:var(--radius-btn);
      padding:9px 20px; font-size:12.5px; font-weight:800; cursor:pointer;
      transition:opacity .2s, transform .1s;
    }
    .skip-btn:active { transform:scale(.96); }

    .cta-btn {
      width:100%; padding:13px; border-radius:12px; border:none;
      font-size:14px; font-weight:900; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:7px;
      min-height:46px; transition:all .3s;
    }
    .cta-btn.locked { background:var(--border); color:var(--text-muted); cursor:not-allowed; }
    .cta-btn.unlocked { background:var(--brand-gradient); color:#fff;
      box-shadow:0 5px 16px -4px rgba(155,18,57,.5); animation:pulsePink 2.2s infinite; }
    @keyframes pulsePink {
      0%{box-shadow:0 0 0 0 rgba(155,18,57,.45);}
      60%{box-shadow:0 0 0 10px rgba(155,18,57,0);}
      100%{box-shadow:0 0 0 0 rgba(155,18,57,0);}
    }

    .success-msg { display:none; text-align:center; margin-top:10px; padding:10px 14px;
      background:var(--step-done-bg); border:1.5px solid #c3e6cb; border-radius:10px;
      font-size:12px; font-weight:700; color:var(--step-done-text); animation:fadeIn .4s ease; }
    .success-msg.visible { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }

    .loading-msg { color:#fff; font-weight:700; font-size:13px; text-align:center; margin-top:60px; position:relative; z-index:1; }

    #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; display:none; }
  </style>
</head>
<body>

  <div class="cherry-bg" id="cherry-bg"></div>

  <div class="top-bar">
    <a class="back-btn" href="index.html">←</a>
    <span class="logo-text">Course Details</span>
    <span class="badge-free">FREE</span>
  </div>

  <div class="loading-msg" id="loading-msg">Loading course… 🎓</div>

  <div class="card" id="main-card" style="display:none;">

    <div class="course-info">
      <div class="course-thumb" id="course-thumb">🎓</div>
      <div class="course-meta">
        <div class="course-title" id="course-title">Free Online Course</div>
        <div class="course-tags">
          <span class="tag free-tag">100% FREE</span>
          <span class="tag" id="course-cat">Course</span>
        </div>
        <div class="course-meta-row" id="course-meta-row"></div>
      </div>
    </div>

    <div class="description" id="course-desc"></div>

    <div class="info-grid" id="info-grid"></div>

    <div class="unlock-headline">
      <h2 id="unlock-title">Preparing your link…</h2>
      <p id="unlock-sub">Please wait a few seconds, or tap Skip.</p>
    </div>

    <div class="timer-wrap" id="timer-wrap">
      <div class="timer-ring-box">
        <svg viewBox="0 0 76 76">
          <circle class="timer-ring-bg" cx="38" cy="38" r="34"></circle>
          <circle class="timer-ring-fg" id="ring-fg" cx="38" cy="38" r="34"></circle>
        </svg>
        <div class="timer-num" id="timer-num">45</div>
      </div>
      <button class="skip-btn" id="skip-btn">⏭ Skip</button>
    </div>

    <button class="cta-btn locked" id="btn-enroll" disabled>
      🔒 Wait for the timer to finish
    </button>

    <div class="success-msg" id="success-msg">
      🎉 You're all set! Tap above to go to your course.
    </div>

  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); }

    // إعدادات Supabase (مفتاح publishable — آمن للاستخدام بالمتصفح)
    const SUPABASE_URL = 'https://uliqzxsjnzmimebgppap.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QhO2ft170kcZ1pP8YWl4ZQ_wjhKs5KK';

    const TIMER_SECONDS = 45;
    const RING_CIRCUMFERENCE = 2 * Math.PI * 34; // ≈213.6

    function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function getCourseId() {
      return tg?.initDataUnsafe?.start_param
          || new URLSearchParams(window.location.search).get('id')
          || new URLSearchParams(window.location.search).get('startapp')
          || new URLSearchParams(window.location.search).get('tgWebAppStartParam')
          || '';
    }

    async function loadCourse() {
      const id = getCourseId();
      let course = null;
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/courses?id=eq.${encodeURIComponent(id)}&select=*&limit=1`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        const all = await res.json();
        course = Array.isArray(all) && all.length ? all[0] : null;
      } catch (e) { /* ignore */ }

      if (!course) {
        document.getElementById('loading-msg').textContent = '⚠️ Course not found. Go back and pick another one.';
        return;
      }
      renderCourse(course);
    }

    function renderCourse(c) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('main-card').style.display = 'block';

      document.getElementById('course-title').textContent = c.title || 'Free Online Course';
      document.getElementById('course-cat').textContent = c.category || 'Course';

      const thumb = document.getElementById('course-thumb');
      if (c.image) {
        thumb.innerHTML = `<img src="${esc(c.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🎓'"/>`;
      }

      const metaParts = [];
      if (c.duration) metaParts.push('⏱ ' + esc(c.duration));
      if (c.rating)   metaParts.push('⭐ ' + esc(c.rating));
      if (c.source)   metaParts.push('🏫 ' + esc(c.source));
      document.getElementById('course-meta-row').textContent = metaParts.join('  •  ');

      document.getElementById('course-desc').textContent = c.description || '';

      const infoGrid = document.getElementById('info-grid');
      const rows = [];
      if (c.level)     rows.push(['📶', c.level]);
      if (c.sequences) rows.push(['📋', c.sequences]);
      (c.conditions || []).forEach(cond => rows.push(['✅', cond]));
      infoGrid.innerHTML = rows.map(([ic, txt]) =>
        `<div class="info-row"><span class="ic">${ic}</span><span>${esc(txt)}</span></div>`
      ).join('');

      startTimer(c.enroll_url || c.course_url || 'https://www.my-mooc.com/');
    }

    let timeLeft = TIMER_SECONDS;
    let timerInterval = null;
    let finalUrl = 'https://www.my-mooc.com/';

    function startTimer(url) {
      finalUrl = url;
      const ring = document.getElementById('ring-fg');
      const num  = document.getElementById('timer-num');
      ring.style.strokeDasharray = RING_CIRCUMFERENCE;
      ring.style.strokeDashoffset = 0;

      timerInterval = setInterval(() => {
        timeLeft--;
        num.textContent = timeLeft > 0 ? timeLeft : '✓';
        ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - timeLeft / TIMER_SECONDS);
        if (timeLeft <= 0) finishTimer();
      }, 1000);
    }

    function finishTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-wrap').style.display = 'none';
      document.getElementById('unlock-title').textContent = 'Your link is ready!';
      document.getElementById('unlock-sub').textContent = 'Tap the button below to start learning.';

      const btn = document.getElementById('btn-enroll');
      btn.disabled = false;
      btn.className = 'cta-btn unlocked';
      btn.innerHTML = '🎓 Go to Course';
      document.getElementById('success-msg').classList.add('visible');
      launchConfetti();
    }

    document.getElementById('skip-btn').addEventListener('click', () => {
      timeLeft = 0;
      finishTimer();
    });

    document.getElementById('btn-enroll').addEventListener('click', () => {
      if (!finalUrl) return;
      if (tg?.openLink) { tg.openLink(finalUrl); setTimeout(() => tg.close(), 800); }
      else window.open(finalUrl, '_blank');
    });

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.style.display = 'block';
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const colors = ['#e8185a','#ffffff','#9b1239','#ffd6e8','#b50d42','#ffb3ce'];
      const pieces = Array.from({length:80}, () => ({
        x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height,
        r:Math.random()*4+2, d:Math.random()*2+1,
        color:colors[Math.floor(Math.random()*colors.length)],
        tilt:Math.random()*10-5, tiltSpeed:(Math.random()*.07+.03)*(Math.random()<.5?1:-1),
      }));
      let frame = 0;
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
          ctx.beginPath(); ctx.fillStyle = p.color;
          ctx.ellipse(p.x,p.y,p.r,p.r*0.4,p.tilt,0,Math.PI*2); ctx.fill();
          p.y += p.d + frame/80; p.tilt += p.tiltSpeed; p.x += Math.sin(frame/20)*0.5;
          if (p.y > canvas.height) { p.y = -10; p.x = Math.random()*canvas.width; }
        });
        frame++;
        if (frame < 150) requestAnimationFrame(draw);
        else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display = 'none'; }
      }
      draw();
    }

    (function() {
      const container = document.getElementById('cherry-bg');
      for (let i=0;i<12;i++){
        const el = document.createElement('div');
        el.className = 'cherry-pair'; el.textContent = '🍒';
        const size = 18+Math.random()*18, left = Math.random()*96,
              duration = 14+Math.random()*16, delay = Math.random()*22;
        el.style.cssText = `left:${left}%;font-size:${size}px;animation-duration:${duration}s;animation-delay:-${delay}s;`;
        container.appendChild(el);
      }
    })();

    loadCourse();
  </script>

</body>
</html>
