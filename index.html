<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Courses2027 — Free Courses</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand-pink:      #e8185a;
      --brand-pink-dark: #b50d42;
      --brand-cherry:    #9b1239;
      --brand-gradient:  linear-gradient(135deg, #e8185a, #9b1239);
      --bg:              #fff5f8;
      --card:            #ffffff;
      --text:            #1c1d1f;
      --text-muted:      #6a6f73;
      --border:          #f0dde5;
      --chip-bg:         #fde6ee;
      --radius-card:     18px;
      --shadow-card:     0 4px 20px rgba(155,18,57,.10);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Mulish', sans-serif;
      background: linear-gradient(160deg, #ffe0ec 0%, #ffb8cf 40%, #ff8fb5 70%, #ff6699 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 32px;
    }
    .top-bar {
      width:100%; background:var(--brand-gradient);
      padding:16px 18px 14px;
      display:flex; align-items:center; gap:10px;
      position:sticky; top:0; z-index:5;
    }
    .logo-u { width:32px; height:32px; border-radius:6px; background:#fff;
      display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .logo-text { font-size:15px; font-weight:800; color:#fff; }
    .badge-free { margin-left:auto; background:#fff; color:var(--brand-pink-dark);
      font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; }

    .filters {
      display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px;
      -ms-overflow-style:none; scrollbar-width:none;
    }
    .filters::-webkit-scrollbar { display:none; }
    .filter-chip {
      flex-shrink:0; padding:7px 14px; border-radius:20px;
      font-size:12px; font-weight:800; background:#fff; color:var(--brand-pink-dark);
      border:1.5px solid var(--border); cursor:pointer; transition:all .2s;
    }
    .filter-chip.active { background:var(--brand-gradient); color:#fff; border-color:transparent; }

    .grid { display:flex; flex-direction:column; gap:12px; padding:12px 16px 0; max-width:520px; margin:0 auto; }

    .course-card {
      background:var(--card); border-radius:var(--radius-card);
      box-shadow:var(--shadow-card); overflow:hidden;
      display:flex; gap:12px; padding:12px; cursor:pointer;
      text-decoration:none; color:inherit;
      animation:slideUp .35s ease both;
      transition:transform .12s;
    }
    .course-card:active { transform:scale(.98); }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

    .course-thumb {
      width:74px; height:74px; border-radius:12px; flex-shrink:0;
      background:var(--brand-gradient); overflow:hidden;
      display:flex; align-items:center; justify-content:center; font-size:26px;
    }
    .course-thumb img { width:100%; height:100%; object-fit:cover; }

    .course-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
    .course-title {
      font-size:13.5px; font-weight:800; line-height:1.3;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .course-tags { display:flex; gap:5px; flex-wrap:wrap; }
    .tag { font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:5px; background:var(--chip-bg); color:var(--brand-pink-dark); }
    .tag.free { background:var(--brand-gradient); color:#fff; }
    .course-meta-row { font-size:10.5px; font-weight:700; color:var(--text-muted); }

    .empty-state, .loading-state {
      text-align:center; color:#fff; font-weight:700; font-size:13px;
      padding:60px 20px; opacity:.9;
    }
    .skel-card {
      background:#ffffffaa; border-radius:var(--radius-card); height:98px;
      animation:shimmer 1.4s infinite ease-in-out; margin-bottom:12px;
    }
    @keyframes shimmer { 0%,100%{opacity:.5;} 50%{opacity:.9;} }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="logo-u"><span>🎓</span></div>
    <span class="logo-text">Courses2027 — Free Courses</span>
    <span class="badge-free">FREE</span>
  </div>

  <div class="filters" id="filters">
    <div class="filter-chip active" data-cat="all">All</div>
    <div class="filter-chip" data-cat="Data Science">Data Science</div>
    <div class="filter-chip" data-cat="Programming">Programming</div>
    <div class="filter-chip" data-cat="Engineering">Engineering</div>
  </div>

  <div class="grid" id="grid">
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
    <div class="skel-card"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); }

    let ALL_COURSES = [];
    let ACTIVE_CAT = 'all';

    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function courseCardHTML(c) {
      const img = c.image
        ? `<img src="${esc(c.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🎓'"/>`
        : '🎓';
      const metaParts = [];
      if (c.duration) metaParts.push('⏱ ' + esc(c.duration));
      if (c.rating)   metaParts.push('⭐ ' + esc(c.rating));
      if (c.source)   metaParts.push('🏫 ' + esc(c.source));
      return `
        <a class="course-card" href="info.html?id=${encodeURIComponent(c.id)}">
          <div class="course-thumb">${img}</div>
          <div class="course-body">
            <div class="course-title">${esc(c.title)}</div>
            <div class="course-tags">
              <span class="tag free">FREE</span>
              <span class="tag">${esc(c.category || 'Course')}</span>
            </div>
            <div class="course-meta-row">${metaParts.join('  •  ')}</div>
          </div>
        </a>`;
    }

    function render() {
      const grid = document.getElementById('grid');
      const list = ACTIVE_CAT === 'all'
        ? ALL_COURSES
        : ALL_COURSES.filter(c => c.category === ACTIVE_CAT);

      if (!list.length) {
        grid.innerHTML = '<div class="empty-state">No courses yet — check back soon! 🎓</div>';
        return;
      }
      grid.innerHTML = list.map(courseCardHTML).join('');
    }

    document.getElementById('filters').addEventListener('click', (e) => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      ACTIVE_CAT = chip.dataset.cat;
      render();
    });

    async function loadCourses() {
      try {
        const res = await fetch('courses.json?t=' + Date.now());
        ALL_COURSES = await res.json();
      } catch (e) {
        ALL_COURSES = [];
      }
      render();
    }

    loadCourses();
  </script>

</body>
</html>
