<!DOCTYPE html>
<html lang="en" dir="ltr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Course Access</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:#ed173f;--r2:#b5082d;--r3:#8e0626;--muted:#6b6870;--border:#f2d9df}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Mulish,sans-serif;background:linear-gradient(155deg,#fff4f6,#ffbdc9 50%,#ed173f);min-height:100vh;color:#18181b}.top{background:linear-gradient(135deg,var(--r),var(--r3));padding:14px 17px;display:flex;align-items:center;gap:10px;color:#fff}.back{color:#fff;text-decoration:none;font-size:21px}.tt{font-size:15px;font-weight:900}.tb{margin-left:auto;background:#fff;color:var(--r2);font-size:10px;font-weight:900;padding:4px 9px;border-radius:18px}.card{width:calc(100% - 28px);max-width:470px;margin:16px auto;background:#fff;border-radius:20px;box-shadow:0 6px 28px #8e06262b;padding:17px}.course{display:flex;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--border)}.thumb{width:76px;height:76px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--r),var(--r3));display:flex;align-items:center;justify-content:center;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover}.title{font-size:14px;font-weight:900;line-height:1.35}.tags{display:flex;gap:5px;margin-top:6px}.tag{font-size:9px;font-weight:900;padding:3px 7px;border-radius:5px;background:#ffe4e9;color:var(--r2)}.free{background:linear-gradient(135deg,var(--r),var(--r3));color:#fff}.deal{background:#111;color:#fff}.price{margin-top:7px;font-size:13px;font-weight:900}.old{text-decoration:line-through;color:#999;margin-left:4px}.desc{font-size:11.5px;line-height:1.55;color:var(--muted);margin:14px 0}.meta{font-size:11px;font-weight:800;line-height:1.7}.unlock{text-align:center;margin-top:16px}.unlock h2{font-size:15px;font-weight:900}.unlock p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.ads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.step{border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;font-size:10px;font-weight:900}.step.active{border-color:var(--r);color:var(--r2)}.step.done{background:#e8f6ed;border-color:#b9e2c6;color:#16833b}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:13px}.ad{background:linear-gradient(135deg,var(--r),var(--r3));color:#fff}.go{display:none;background:linear-gradient(135deg,var(--r),var(--r3));color:#fff}.ok{display:none;text-align:center;background:#e8f6ed;color:#16833b;border:1px solid #b9e2c6;border-radius:10px;padding:10px;margin-top:10px;font-size:11px;font-weight:900}.loading{color:#fff;text-align:center;padding:60px 20px;font-weight:900}
</style></head><body>
<div class="top"><a class="back" href="index.html">←</a><span class="tt">Course Access</span><span class="tb">2 ADS</span></div>
<div class="loading" id="loading">Loading course… 🎓</div>
<div class="card" id="card" style="display:none"><div class="course"><div class="thumb" id="thumb">🎓</div><div><div class="title" id="title"></div><div class="tags"><span class="tag free" id="status">100% FREE</span><span class="tag" id="cat"></span></div><div class="price" id="price"></div></div></div>
<div class="desc" id="desc"></div><div class="meta" id="meta"></div><div class="unlock"><h2 id="head">Watch 2 ads to unlock your course</h2><p id="sub">Complete both rewarded ads. The course link appears after Ad 2.</p></div>
<div class="ads"><div class="step active" id="s1">① AD 1<br><span>Ready</span></div><div class="step" id="s2">② AD 2<br><span>Locked</span></div></div>
<button class="btn ad" id="watch">▶ Watch Ad 1</button><button class="btn go" id="go">🎓 Go to Course</button><div class="ok" id="ok">🎉 Both ads completed. Your course link is unlocked!</div></div>
<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}const U="https://uliqzxsjnzmimebgppap.supabase.co",K="sb_publishable_QhO2ft170kcZ1pP8YWl4ZQ_wjhKs5KK",BLOCK="40864";let course=null,step=1,ctrl=null,finalUrl="";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"),qid=()=>tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("id")||"";
function ads(){if(ctrl)return ctrl;if(window.Adsgram&&typeof Adsgram.init==="function")ctrl=Adsgram.init({blockId:BLOCK});return ctrl}
function showAd(){return new Promise(resolve=>{let c=ads();if(!c){resolve("no_ad");return}let done=false,t=setTimeout(()=>{if(!done){done=true;resolve("no_ad")}},12000);c.show().then(()=>{if(done)return;done=true;clearTimeout(t);resolve("shown")}).catch(x=>{if(done)return;done=true;clearTimeout(t);resolve(x&&x.state==="playing"?"closed_early":"no_ad")})})}
function render(c){loading.style.display="none";card.style.display="block";title.textContent=c.title||"Course";cat.textContent=c.category||"Course";if(c.image)thumb.innerHTML=`<img src="${esc(c.image)}" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🎓'">`;if(c.is_free){status.textContent="100% FREE";status.className="tag free";price.textContent="Free"}else{status.textContent=(c.discount||"DEAL")+" OFF";status.className="tag deal";price.innerHTML=`${c.price!=null?"$"+Number(c.price).toFixed(2):"Deal"}${c.original_price?` <span class="old">$${Number(c.original_price).toFixed(2)}</span>`:""}`}desc.textContent=c.description||"";meta.textContent=[c.platform,c.rating?"⭐ "+c.rating:"",c.students?"👥 "+c.students:"",c.level?"📶 "+c.level:""].filter(Boolean).join(" • ");finalUrl=c.enroll_url||c.course_url||c.detail_url||"https://korshub.com/"}
function steps(){s1.className="step "+(step>1?"done":"active");s1.innerHTML="① AD 1<br><span>"+(step>1?"Completed":"Ready")+"</span>";s2.className="step "+(step>2?"done":step===2?"active":"");s2.innerHTML="② AD 2<br><span>"+(step>2?"Completed":step===2?"Ready":"Locked")+"</span>"}
async function load(){try{let r=await fetch(`${U}/rest/v1/courses?id=eq.${encodeURIComponent(qid())}&select=*&limit=1`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});let a=await r.json();course=a[0]||null}catch(e){}if(!course){loading.textContent="⚠️ Course not found.";return}render(course)}
watch.onclick=async()=>{if(watch.disabled)return;watch.disabled=true;watch.textContent="⏳ Loading ad…";let result=await showAd();if(result==="closed_early"){watch.disabled=false;watch.textContent="▶ Watch Ad "+step;return}if(step===1){step=2;steps();head.textContent="One more ad to unlock";sub.textContent="Complete Ad 2 and your course link will be revealed.";watch.disabled=false;watch.textContent="▶ Watch Ad 2"}else{step=3;steps();watch.style.display="none";go.style.display="block";ok.style.display="block";head.textContent="Your course is ready!";sub.textContent="Tap below to open the official course through Korshub."}};
go.onclick=()=>{if(tg?.openLink){tg.openLink(finalUrl);setTimeout(()=>tg.close(),800)}else window.open(finalUrl,"_blank")};load();
</script></body></html>
